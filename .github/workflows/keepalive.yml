name: Keep the free server awake

# The server keeps itself awake (see _keep_awake in server.py). This job is the backstop that wakes it
# if it ever goes down, and it saves what the server has learned since the last deploy (new Telegram
# subscribers, stocks visitors added) to the repo, so a restart of the free host never loses them.
# GitHub runs scheduled jobs best-effort, often far less often than the cron asks.
on:
  schedule:
    - cron: "*/10 2-18 * * *"   # every 10 min, 07:30-00:30 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping
        if: ${{ vars.FINN_PUBLIC_URL != '' }}
        run: curl -fsS -m 90 -o /dev/null "${{ vars.FINN_PUBLIC_URL }}/api/status" || true

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q httpx cryptography python-dotenv

      - name: Save Telegram subscribers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FINN_PUBLIC_URL: ${{ vars.FINN_PUBLIC_URL }}
        run: |
          python scripts/sync_subscribers.py || true
          git add data/universe.json
          if [ -f data/subscribers.enc ]; then git add data/subscribers.enc; fi
          if ! git diff --cached --quiet; then
            git config user.name "finn-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: sync subscribers and tracked stocks [skip render]"
            git pull --rebase -q && git push
          fi
