name: Keep the free server awake

# Render's free tier sleeps after 15 idle minutes and takes ~30-60 s to wake.
# A light ping during Indian daytime keeps the first visit fast (well within 750 free hours/month).
on:
  schedule:
    - cron: "*/10 2-18 * * *"   # every 10 min, 07:30-00:30 IST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping
        if: ${{ vars.FINN_PUBLIC_URL != '' }}
        run: curl -fsS -m 90 -o /dev/null "${{ vars.FINN_PUBLIC_URL }}/api/status" || true
